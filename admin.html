<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾趣萬象｜管理員後台</title>
<style>
:root{--bg:#f7f3ec;--card:#fffdf9;--ink:#22241f;--muted:#777970;--green:#365f50;--line:#e3ddd3;--red:#a94f4f;--gold:#b47b2a}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.wrap{max-width:1180px;margin:0 auto;padding:30px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.brand{font-size:26px;font-weight:900}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}.login{max-width:460px;margin:80px auto}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:750;cursor:pointer}.primary{background:var(--green);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:var(--red);color:#fff}.warn{background:#d89c3e;color:#fff}.hidden{display:none!important}.list{display:grid;gap:12px}.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.row{display:grid;grid-template-columns:110px 1fr;gap:14px}.thumb{width:110px;height:110px;border-radius:14px;background:#eae3d9;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.notice{background:#f0ebe2;border-radius:13px;padding:12px;line-height:1.65;color:#62645d;font-size:13px;margin-top:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;padding:35px;color:var(--muted)}.tabs{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.tab.active{background:#222;color:#fff}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.pending{background:#fff0bd;color:#806000}.approved{background:#dcefe6;color:#246446}.returned{background:#f8dfc4;color:#865719}.rejected{background:#f4d8d8;color:#913d3d}.sold{background:#e6e6e6;color:#555}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.summary .card{margin:0;padding:14px}.summary b{display:block;font-size:22px;margin-top:5px}.error{color:#a94f4f}.sold-card{border-left:4px solid var(--gold)}
@media(max-width:720px){.row{grid-template-columns:1fr}.thumb{width:100%;height:220px}.summary{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}

.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(24,25,22,.48);display:flex;align-items:center;justify-content:center;padding:20px}.modal-card{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.22);padding:22px}.modal-card.wide{width:min(1180px,100%)}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:16px}.modal-head h3{margin:0;font-size:24px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-grid .field{margin:0}.span2{grid-column:1/-1}.readonly{background:#f3efe8!important;color:#777970}.preview-tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 0}.checkline{display:flex;align-items:center;gap:8px;font-weight:700}.preview-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.preview-table{border-collapse:collapse;min-width:1350px;width:100%;font-size:13px}.preview-table th,.preview-table td{padding:10px 12px;border-bottom:1px solid var(--line);border-right:1px solid #eee9e0;text-align:left;white-space:nowrap}.preview-table th{position:sticky;top:0;background:#f3efe8;z-index:1}.preview-table tr:last-child td{border-bottom:0}.modal-note{font-size:12px;color:var(--muted);line-height:1.65;margin-top:8px}
@media(max-width:720px){.modal-grid{grid-template-columns:1fr}.span2{grid-column:auto}.modal-card{padding:18px}}
</style>
</head>
<body><div class="wrap">
<section id="loginView" class="card login">
  <div class="brand">拾趣萬象</div><div class="muted">管理員後台</div>
  <div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" placeholder="請輸入管理員 Email"></div>
  <div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼"></div>
  <button class="btn primary" id="loginBtn">登入後台</button>
  <p id="loginMsg" class="muted"></p>
</section>
<section id="adminView" class="hidden">
  <div class="top"><div><div class="brand">拾趣萬象｜管理員後台</div><div class="muted">商品審核、詢問與交易完成紀錄</div></div><div><a href="./index.html"><button class="btn ghost">回前台</button></a> <button class="btn ghost" id="refreshBtn">重新整理</button> <button class="btn ghost" id="logoutBtn">登出</button></div></div>
  <div class="summary"><div class="card"><span class="muted">待審核</span><b id="countPending">0</b></div><div class="card"><span class="muted">已上架</span><b id="countApproved">0</b></div><div class="card"><span class="muted">交易完成</span><b id="countSold">0</b></div><div class="card"><span class="muted">全部商品</span><b id="countAll">0</b></div></div>
  <div class="tabs"><button class="tab active" data-filter="pending">待審核</button><button class="tab" data-filter="approved">已上架</button><button class="tab" data-filter="sold">交易完成</button><button class="tab" data-filter="all">全部商品</button><button class="tab" data-filter="inquiries">詢問管理</button><button class="tab" id="exportPreviewBtn">預覽 / 匯出交易明細</button></div>
  <div id="list" class="list"></div>
</section>
</div>
<div id="editModal" class="modal-overlay hidden" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head"><div><h3>編輯交易資料</h3><div class="muted" id="editProductLabel"></div></div><button class="btn ghost" id="closeEditModalBtn">關閉</button></div>
    <div class="modal-grid">
      <div class="field"><label>交易方式</label><input id="editTransactionMethod" placeholder="例如：面交、銀行轉帳"></div>
      <div class="field"><label>賣家銀行帳號</label><input id="editSellerBank" placeholder="沒有可留空"></div>
      <div class="field"><label>買家姓名</label><input id="editBuyerName" placeholder="請輸入買家姓名"></div>
      <div class="field"><label>買家聯絡方式</label><input id="editBuyerContact" placeholder="手機、LINE 或其他聯絡方式"></div>
      <div class="field"><label>買家銀行帳號</label><input id="editBuyerBank" placeholder="沒有可留空"></div>
      <div class="field"><label>交易時間</label><input id="editSoldAt" class="readonly" readonly></div>
      <div class="field span2"><label>後台備註</label><textarea id="editReviewNote" placeholder="選填"></textarea></div>
    </div>
    <div id="editModalMsg" class="modal-note"></div>
    <div class="modal-actions"><button class="btn ghost" id="cancelEditBtn">取消</button><button class="btn primary" id="saveEditBtn">儲存修改</button></div>
  </div>
</div>
<div id="exportModal" class="modal-overlay hidden" aria-hidden="true">
  <div class="modal-card wide">
    <div class="modal-head"><div><h3>交易明細預覽</h3><div class="muted">先確認實際匯出內容，再下載 CSV。</div></div><button class="btn ghost" id="closeExportModalBtn">關閉</button></div>
    <div class="preview-tools"><label class="checkline"><input type="checkbox" id="showFullName" checked> 顯示完整姓名</label><span class="muted">關閉後姓名會遮罩，例如：王Ｏ明</span></div>
    <div id="exportCount" class="modal-note"></div>
    <div class="preview-wrap"><table class="preview-table"><thead id="exportHead"></thead><tbody id="exportBody"></tbody></table></div>
    <div class="modal-actions"><button class="btn ghost" id="cancelExportBtn">取消</button><button class="btn primary" id="downloadCsvBtn">下載 CSV</button></div>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://lpmxxebdcydlsticwlkd.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_5F9HuTm-P5Wof0b-KmOXfw_pT7rRvVF";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id); let products=[], inquiries=[], filter="pending";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"NT$ "+Number(n||0).toLocaleString("zh-TW");
const statusText=s=>({pending:"待審核",approved:"已上架",returned:"退回修改",rejected:"已拒絕",sold:"已售出"})[s]||s;
const fmt=d=>d?new Date(d).toLocaleString("zh-TW",{hour12:false}):"—";
function meta(desc=""){const raw=String(desc); const pick=l=>raw.match(new RegExp(`^\\s*${l}\\s*[：:]\\s*(.+)$`,'mu'))?.[1]?.trim()||""; return {size:pick("尺寸"),color:pick("顏色"),quantity:pick("數量"),desc:raw.replace(/^\s*(尺寸|顏色|數量)\s*[：:]\s*.*$/gmu,"").replace(/\n{3,}/g,"\n\n").trim()}}
async function checkAdmin(){const {data:{session}}=await supabase.auth.getSession(); if(!session)return false; const {data,error}=await supabase.rpc("am_i_admin"); return !error&&data===true}
async function showAdmin(){ $("loginView").classList.add("hidden"); $("adminView").classList.remove("hidden"); await loadAll(); }
async function loadAll(){ $("list").innerHTML='<div class="empty">讀取中…</div>'; const {data,error}=await supabase.rpc("admin_list_products"); if(error){$("list").innerHTML=`<div class="empty error">讀取失敗：${esc(error.message)}</div>`;return} products=data||[]; $("countPending").textContent=products.filter(p=>p.status==="pending").length; $("countApproved").textContent=products.filter(p=>p.status==="approved").length; $("countSold").textContent=products.filter(p=>p.status==="sold").length; $("countAll").textContent=products.length; if(filter==="inquiries") await loadInquiries(); else renderProducts(); }
function productCard(p){const m=meta(p.description); const image=p.image_urls?.[0]; const sold=p.status==="sold"; return `<div class="item ${sold?'sold-card':''}"><div class="row"><div class="thumb">${image?`<img src="${esc(image)}" alt="">`:"📦"}</div><div><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} · ${esc(p.condition)} · ${money(p.price)}</div></div><span class="status ${esc(p.status)}">${statusText(p.status)}</span></div><div class="notice">姓名：${esc(p.seller_name)}<br>聯絡方式：${esc(p.contact)}${p.order_no?`<br>訂單編號：${esc(p.order_no)}`:""}<br>尺寸：${esc(m.size||"—")}　顏色：${esc(m.color||"—")}　數量：${esc(m.quantity||"—")}<br>描述：${esc(m.desc||"未填寫")}</div>${p.review_note&&p.status!=="sold"?`<div class="notice">審核說明：${esc(p.review_note)}</div>`:""}${sold?`<div class="notice"><b>交易資料</b><br>交易方式：${esc(p.transaction_method||"—")}<br>賣家銀行帳號：${esc(p.seller_bank_account||"—")}<br>買家姓名：${esc(p.buyer_name||"—")}<br>買家聯絡方式：${esc(p.buyer_contact||"—")}<br>買家銀行帳號：${esc(p.buyer_bank_account||"—")}<br>交易時間：${fmt(p.sold_at)}</div><div class="actions"><button class="btn ghost" onclick="openEditTransaction('${p.id}')">編輯交易資料</button></div>`:""}${p.status==="pending"?`<div class="actions"><button class="btn primary" onclick="reviewProduct('${p.id}','approved')">通過上架</button><button class="btn warn" onclick="reviewProduct('${p.id}','returned')">退回修改</button><button class="btn danger" onclick="reviewProduct('${p.id}','rejected')">拒絕刊登</button></div>`:""}${p.status==="approved"?`<div class="actions"><button class="btn ghost" onclick="reviewProduct('${p.id}','sold')">設為已售出</button></div>`:""}</div></div></div>`}
function renderProducts(){let list=products; if(filter!=="all")list=products.filter(p=>p.status===filter); $("list").innerHTML=list.length?list.map(productCard).join(""):'<div class="empty">目前沒有資料。</div>';}
function maskName(name){const s=String(name||"").trim(); if(!s)return ""; if(s.length===1)return s; if(s.length===2)return s[0]+"Ｏ"; return s[0]+"Ｏ".repeat(Math.max(1,s.length-2))+s[s.length-1];}
let editingTransactionId=null;
function setModal(id,open){const el=$(id); el.classList.toggle("hidden",!open); el.setAttribute("aria-hidden",open?"false":"true");}
window.openEditTransaction=id=>{const p=products.find(x=>x.id===id); if(!p)return alert("找不到這筆交易資料"); editingTransactionId=id; $("editProductLabel").textContent=`${p.order_no||"未編號"}｜${p.name||"未命名商品"}`; $("editTransactionMethod").value=p.transaction_method||""; $("editSellerBank").value=p.seller_bank_account||""; $("editBuyerName").value=p.buyer_name||""; $("editBuyerContact").value=p.buyer_contact||""; $("editBuyerBank").value=p.buyer_bank_account||""; $("editSoldAt").value=fmt(p.sold_at); $("editReviewNote").value=p.review_note||""; $("editModalMsg").textContent=""; setModal("editModal",true);};
async function saveTransactionEdit(){const p=products.find(x=>x.id===editingTransactionId); if(!p)return; const btn=$("saveEditBtn"); btn.disabled=true; btn.textContent="儲存中…"; $("editModalMsg").textContent=""; const {error}=await supabase.rpc("admin_complete_transaction",{p_product_id:p.id,p_transaction_method:$("editTransactionMethod").value.trim(),p_seller_bank_account:$("editSellerBank").value.trim(),p_buyer_name:$("editBuyerName").value.trim(),p_buyer_contact:$("editBuyerContact").value.trim(),p_buyer_bank_account:$("editBuyerBank").value.trim(),p_review_note:$("editReviewNote").value.trim()}); btn.disabled=false; btn.textContent="儲存修改"; if(error){$("editModalMsg").textContent="更新失敗："+error.message;return} setModal("editModal",false); await loadAll();}
const exportHeaders=["訂單編號","商品名稱","商品分類","商品價格","賣家姓名","賣家聯絡方式","交易方式","賣家銀行帳號","買家姓名","買家聯絡方式","買家銀行帳號","交易時間"];
function soldRows(){const full=$("showFullName")?.checked!==false; return products.filter(p=>p.status==="sold").map(p=>[p.order_no||"",p.name||"",p.category||"",p.price??"",full?(p.seller_name||""):maskName(p.seller_name),p.contact||"",p.transaction_method||"",p.seller_bank_account||"",full?(p.buyer_name||""):maskName(p.buyer_name),p.buyer_contact||"",p.buyer_bank_account||"",fmt(p.sold_at)]);}
function renderExportPreview(){const rows=soldRows(); $("exportCount").textContent=`共 ${rows.length} 筆交易完成紀錄`; $("exportHead").innerHTML='<tr>'+exportHeaders.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>'; $("exportBody").innerHTML=rows.length?rows.map(r=>'<tr>'+r.map(v=>`<td>${esc(v)}</td>`).join('')+'</tr>').join(''):'<tr><td colspan="12" style="text-align:center;padding:30px">目前沒有交易完成資料</td></tr>'; $("downloadCsvBtn").disabled=!rows.length;}
function openExportPreview(){renderExportPreview(); setModal("exportModal",true);}
function csvCell(v){const s=String(v??"");return `"${s.replace(/"/g,'""')}"`;}
function downloadSoldCsv(){const rows=soldRows(); if(!rows.length)return; const csv='\uFEFF'+[exportHeaders,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'); const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`拾趣萬象_交易明細_${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);}
window.reviewProduct=async(id,status)=>{let note="審核通過"; if(status==="returned")note=prompt("退回修改原因：","請補充更清楚的商品資訊或照片。")||"請補充商品資訊後重新送審。"; if(status==="rejected")note=prompt("拒絕原因：","商品不符合平台刊登規範。")||"商品不符合平台刊登規範。"; if(status==="sold"){const method=prompt("交易方式：","面交")||""; const sellerBank=prompt("賣家銀行帳號（沒有可留空）：","")||""; const buyerName=prompt("買家姓名：","")||""; const buyerContact=prompt("買家聯絡方式：","")||""; const buyerBank=prompt("買家銀行帳號（沒有可留空）：","")||""; const note=prompt("後台備註（選填）：","")||""; const {error}=await supabase.rpc("admin_complete_transaction",{p_product_id:id,p_transaction_method:method,p_seller_bank_account:sellerBank,p_buyer_name:buyerName,p_buyer_contact:buyerContact,p_buyer_bank_account:buyerBank,p_review_note:note}); if(error)return alert("操作失敗："+error.message); await loadAll(); return} const {error}=await supabase.rpc("admin_review_listing",{p_product_id:id,p_status:status,p_review_note:note}); if(error)return alert("操作失敗："+error.message); await loadAll();}
async function loadInquiries(){const {data,error}=await supabase.rpc("admin_list_inquiries",{p_status:"all"}); if(error){$("list").innerHTML=`<div class="empty error">詢問讀取失敗：${esc(error.message)}</div>`;return} inquiries=data||[]; $("list").innerHTML=inquiries.length?inquiries.map(i=>`<div class="item"><b>${esc(i.product_name||"一般客服詢問")}</b><div class="muted">${fmt(i.created_at)} · ${esc(i.status)}</div><div class="notice">姓名：${esc(i.buyer_name)}<br>聯絡方式：${esc(i.buyer_contact)}<br>內容：${esc(i.message)}</div>${i.admin_note?`<div class="notice">後台備註：${esc(i.admin_note)}</div>`:""}<div class="actions"><button class="btn ghost" onclick="updateInquiry('${i.id}','processing')">處理中</button><button class="btn primary" onclick="updateInquiry('${i.id}','resolved')">已完成</button></div></div>`).join(""):'<div class="empty">目前沒有詢問。</div>';}
window.updateInquiry=async(id,status)=>{const note=prompt("後台備註：","")||""; const {error}=await supabase.rpc("admin_update_inquiry",{p_inquiry_id:id,p_status:status,p_admin_note:note}); if(error)return alert("更新失敗："+error.message); await loadInquiries();}
$("loginBtn").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value; $("loginMsg").textContent="登入中…"; const {error}=await supabase.auth.signInWithPassword({email,password}); if(error){$("loginMsg").textContent="登入失敗："+error.message;return} if(!await checkAdmin()){await supabase.auth.signOut();$("loginMsg").textContent="此帳號沒有管理員權限";return} await showAdmin();}
$("logoutBtn").onclick=async()=>{await supabase.auth.signOut();location.reload()}; $("refreshBtn").onclick=loadAll;
$("exportPreviewBtn").onclick=openExportPreview; $("downloadCsvBtn").onclick=downloadSoldCsv; $("showFullName").onchange=renderExportPreview;
$("saveEditBtn").onclick=saveTransactionEdit; ["closeEditModalBtn","cancelEditBtn"].forEach(id=>$(id).onclick=()=>setModal("editModal",false)); ["closeExportModalBtn","cancelExportBtn"].forEach(id=>$(id).onclick=()=>setModal("exportModal",false));
["editModal","exportModal"].forEach(id=>$(id).addEventListener("click",e=>{if(e.target===$(id))setModal(id,false)}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){setModal("editModal",false);setModal("exportModal",false)}});
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=async()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b)); if(filter==="inquiries")await loadInquiries(); else renderProducts();});
if(await checkAdmin())await showAdmin();
</script></body></html>
