000}.approved{background:#dcefe6;color:#246446}.returned{background:#f8dfc4;color:#865719}.rejected{background:#f4d8d8;color:#913d3d}.sold{background:#e6e6e6;color:#555}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.summary .card{margin:0;padding:14px}.summary b{display:block;font-size:22px;margin-top:5px}.error{color:#a94f4f}.sold-card{border-left:4px solid var(--gold)}
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(24,25,22,.48);display:flex;align-items:center;justify-content:center;padding:20px}.modal-card{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.22);padding:22px}.modal-card.wide{width:min(1180px,100%)}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:16px}.modal-head h3{margin:0;font-size:24px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-grid .field{margin:0}.span2{grid-column:1/-1}.preview-tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 0}.checkline{display:flex;align-items:center;gap:8px;font-weight:700}.select-panel{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;margin-bottom:14px}.select-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.select-list{display:grid;gap:8px;max-height:230px;overflow:auto}.select-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid #eee9e0;border-radius:12px;background:#fff}.select-item input{margin-top:3px;transform:scale(1.15)}.select-item b{display:block}.preview-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#eee9e0;padding:18px}.a4-pages{display:flex;flex-direction:column;align-items:center;gap:18px}.a4-sheet{width:min(210mm,100%);min-height:297mm;background:#fff;padding:16mm 15mm;border:1px solid #d9d3ca;box-shadow:0 10px 28px rgba(0,0,0,.08);page-break-after:always;break-after:page}.a4-sheet:last-child{page-break-after:auto;break-after:auto}.a4-title{font-size:24px;font-weight:900;text-align:center;margin-bottom:4px}.a4-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}.detail-table{bord @media(max-width:720px){.row{grid-template-columns:1fr}.thumb{width:100%;height:220px}.summary{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.modal-grid{grid-template-columns:1fr}.span2{grid-column:auto}.modal-card{padding:18px}.preview-wrap{padding:8px}.a4-sheet{min-height:auto;padding:20px 14px}.detail-row{grid-template-columns:110px 1fr}.detail-label,.detail-value{padding:11px 10px}}

<body><div class="wrap">

</div>

<div id="exportModal" class="modal-overlay hidden" aria-hidden="true"><div class="modal-card wide"><div class="modal-head"><div><h3>交易明細預覽</h3><div class="muted">先勾選要匯出的交易，再預覽與下載 PDF。</div></div><button class="btn ghost" id="closeExportModalBtn">關閉</button></div><div class="preview-tools"><label class="checkline"><input type="checkbox" id="showFullName" checked> 顯示完整姓名</label><span class="muted">關閉後姓名會遮罩，例如：王Ｏ明</span></div><div class="select-panel"><div class="select-head"><b>選擇要匯出的交易</b><div><button class="btn ghost" id="selectAllExportBtn">全選</button> <button class="btn ghost" id="clearExportBtn">取消全選</button></div></div><div id="exportSelectList" class="select-list"></div></div><div id="exportCount" class="modal-note"></div><div class="preview-wrap"><div id="exportPages" class="a4-pages"></div></div><div class="modal-actions"><button class="btn ghost" id="cancelExportBtn">取消</button><button class="btn primary" id="downloadPdfBtn">下載所選 PDF</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://lpmxxebdcydlsticwlkd.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_5F9HuTm-P5Wof0b-KmOXfw_pT7rRvVF";const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);let products=[],inquiries=[],filter="pending",selectedExportIds=new Set();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=n=>"NT$ "+Number(n||0).toLocaleString("zh-TW");const statusText=s=>({pending:"待審核",approved:"已上架",returned:"退回修改",rejected:"已拒絕",sold:"已售出"})[s]||s;const fmt=d=>d?new Date(d).toLocaleString("zh-TW",{hour12:false}):"—";const localDateTimeParts=d=>{if(!d)return{date:"",time:""};const x=new Date(d);if(Number.isNaN(x.getTime()))return{date:"",time:""};const pad=n=>String(n).padStart(2,"0");return{date:`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`,time:`${pad(x.getHours())}:${pad(x.getMinutes())}:${pad(x.getSeconds())}`}};
function meta(desc=""){const raw=String(desc);const pick=l=>raw.match(new RegExp(`^\\s*${l}\\s*[：:]\\s*(.+)$`,'mu'))?.[1]?.trim()||"";return{size:pick("尺寸"),color:pick("顏色"),quantity:pick("數量"),desc:raw.replace(/^\s*(尺寸|顏色|數量)\s*[：:]\s*.*$/gmu,"").replace(/\n{3,}/g,"\n\n").trim()}}
async function checkAdmin(){const{data:{session}}=await supabase.auth.getSession();if(!session)return false;const{data,error}=await supabase.rpc("am_i_admin");return !error&&data===true}async function showAdmin(){$("loginView").classList.add("hidden");$("adminView").classList.remove("hidden");await loadAll()}
async function loadAll(){$("list").innerHTML='<div class="empty">讀取中…</div>';const{data,error}=await supabase.rpc("admin_list_products");if(error){$("list").innerHTML=`<div class="empty error">讀取失敗：${esc(error.message)}</div>`;return}products=data||[];$("countPending").textContent=products.filter(p=>p.status==="pending").length;$("countApproved").textContent=products.filter(p=>p.status==="approved").length;$("countSold").textContent=products.filter(p=>p.status==="sold").length;$("countAll").textContent=products.length;if(filter==="inquiries")await loadInquiries();else renderProducts()}
function productCard(p){const m=meta(p.description),image=p.image_urls?.[0],sold=p.status==="sold";return `<div class="item ${sold?'sold-card':''}"><div class="row"><div class="thumb">${image?`<img src="${esc(image)}" alt="">`:"📦"}</div><div><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} · ${esc(p.condition)} · ${money(p.price)}</div></div><span class="status ${esc(p.status)}">${statusText(p.status)}</span></div><div class="notice">姓名：${esc(p.seller_name)}<br>聯絡方式：${esc(p.contact)}${p.order_no?`<br>訂單編號：${esc(p.order_no)}`:""}<br>尺寸：${esc(m.size||"—")}　顏色：${esc(m.color||"—")}　數量：${esc(m.quantity||"—")}<br>描述：${esc(m.desc||"未填寫")}</div>${p.review_note&&p.status!=="sold"?`<div class="notice">審核說明：${esc(p.review_note)}</div>`:""}${sold?`<div class="notice"><b>交易資料</b><br>交易方式：${esc(p.transaction_method||"—")}<br>賣家姓名：${esc(p.seller_name||"—")}<br>賣家聯絡方式：${esc(p.contact||"—")}<br>賣家銀行帳號：${esc(p.seller_bank_account||"—")}<br>買家姓名：${esc(p.buyer_name||"—")}<br>買家聯絡方式：${esc(p.buyer_contact||"—")}<br>買家銀行帳號：${esc(p.buyer_bank_account||"—")}<br>交易時間：${fmt(p.sold_at)}</div><div class="actions"><button class="btn ghost" onclick="openEditTransaction('${p.id}')">編輯交易資料</button></div>`:""}${p.status==="pending"?`<div class="actions"><button class="btn primary" onclick="reviewProduct('${p.id}','approved')">通過上架</button><button class="btn warn" onclick="reviewProduct('${p.id}','returned')">退回修改</button><button class="btn danger" onclick="reviewProduct('${p.id}','rejected')">拒絕刊登</button></div>`:""}${p.status==="approved"?`<div class="actions"><button class="btn ghost" onclick="reviewProduct('${p.id}','sold')">設為已售出</button></div>`:""}</div></div></div>`}
function renderProducts(){let list=products;if(filter!=="all")list=products.filter(p=>p.status===filter);$("list").innerHTML=list.length?list.map(productCard).join(""):'<div class="empty">目前沒有資料。</div>'}function maskName(name){const s=String(name||"").trim();if(!s)return"";if(s.length===1)return s;if(s.length===2)return s[0]+"Ｏ";return s[0]+"Ｏ".repeat(Math.max(1,s.length-2))+s[s.length-1]}
let editingTransactionId=null;function setModal(id,open){const el=$(id);el.classList.toggle("hidden",!open);el.setAttribute("aria-hidden",open?"false":"true")}
window.openEditTransaction=id=>{const p=products.find(x=>x.id===id);if(!p)return alert("找不到這筆交易資料");editingTransactionId=id;const parts=localDateTimeParts(p.sold_at);$("editProductLabel").textContent=`${p.order_no||"未編號"}｜${p.name||"未命名商品"}`;$("editTransactionMethod").value=p.transaction_method||"";$("editSellerName").value=p.seller_name||"";$("editSellerContact").value=p.contact||"";$("editSellerBank").value=p.seller_bank_account||"";$("editBuyerName").value=p.buyer_name||"";$("editBuyerContact").value=p.buyer_contact||"";$("editBuyerBank").value=p.buyer_bank_account||"";$("editSoldDate").value=parts.date;$("editSoldTime").value=parts.time;$("editReviewNote").value=p.review_note||"";$("editModalMsg").textContent="交易時間可直接手動輸入 HH:MM 或 HH:MM:SS。";setModal("editModal",true)};
async function saveTransactionEdit(){const p=products.find(x=>x.id===editingTransactionId);if(!p)return;const soldDate=$("editSoldDate").value.trim();let soldTime=$("editSoldTime").value.trim().replace(/：/g,":");if(!soldDate||!soldTime){$("editModalMsg").textContent="請完整輸入交易日期與時間";return}const match=soldTime.match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);if(!match){$("editModalMsg").textContent="時間格式請輸入 HH:MM 或 HH:MM:SS，例如 14:35:00";return}const hh=Number(match[1]),mm=Number(match[2]),ss=Number(match[3]||0);if(hh>23||mm>59||ss>59){$("editModalMsg").textContent="時間數值不正確";return}soldTime=`${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;const soldAtDate=new Date(`${soldDate}T${soldTime}`);const btn=$("saveEditBtn");btn.disabled=true;btn.textContent="儲存中…";const{error}=await supabase.rpc("admin_update_transaction_v2",{p_product_id:p.id,p_transaction_method:$("editTransactionMethod").value.trim(),p_seller_name:$("editSellerName").value.trim(),p_seller_contact:$("editSellerContact").value.trim(),p_seller_bank_account:$("editSellerBank").value.trim(),p_buyer_name:$("editBuyerName").value.trim(),p_buyer_contact:$("editBuyerContact").value.trim(),p_buyer_bank_account:$("editBuyerBank").value.trim(),p_sold_at:soldAtDate.toISOString(),p_review_note:$("editReviewNote").value.trim()});btn.disabled=false;btn.textContent="儲存修改";if(error){$("editModalMsg").textContent="更新失敗："+error.message;return}setModal("editModal",false);await loadAll()}
const exportHeaders=["訂單編號","商品名稱","商品分類","商品價格","賣家姓名","賣家聯絡方式","交易方式","賣家銀行帳號","買家姓名","買家聯絡方式","買家銀行帳號","交易時間"];
function soldProducts(){return products.filter(p=>p.status==="sold")}function rowFor(p){const full=$("showFullName")?.checked!==false;return[p.order_no||"",p.name||"",p.category||"",p.price??"",full?(p.seller_name||""):maskName(p.seller_name),p.contact||"",p.transaction_method||"",p.seller_bank_account||"",full?(p.buyer_name||""):maskName(p.buyer_name),p.buyer_contact||"",p.buyer_bank_account||"",fmt(p.sold_at)]}
function selectedSoldProducts(){return soldProducts().filter(p=>selectedExportIds.has(p.id))}
function renderExportSelection(){const sold=soldProducts();$("exportSelectList").innerHTML=sold.length?sold.map(p=>`<label class="select-item"><input type="checkbox" class="export-item-check" data-id="${p.id}" ${selectedExportIds.has(p.id)?"checked":""}><span><b>${esc(p.order_no||"未編號")}｜${esc(p.name||"未命名商品")}</b><span class="muted">${esc(p.seller_name||"—")} · ${fmt(p.sold_at)}</span></span></label>`).join(""):'<div class="empty">目前沒有交易完成資料</div>';document.querySelectorAll(".export-item-check").forEach(c=>c.onchange=()=>{c.checked?selectedExportIds.add(c.dataset.id):selectedExportIds.delete(c.dataset.id);renderExportPreview()})}
function renderExportPreview(){const chosen=selectedSoldProducts(),rows=chosen.map(rowFor);$("exportCount").textContent=`已選 ${rows.length} 筆／共 ${soldProducts().length} 筆交易完成紀錄`;$("exportPages").innerHTML=rows.length?rows.map((r,index)=>`<section class="a4-sheet"><div class="a4-title">拾趣萬象｜交易明細</div><div class="a4-sub">${esc(chosen[index].order_no||`第 ${index+1} 筆交易`)}</div><div class="detail-table">${exportHeaders.map((h,i)=>`<div class="detail-row"><div class="detail-label">${esc(h)}</div><div class="detail-value">${esc(r[i]||"—")}</div></div>`).join("")}</div></section>`).join(""):'<div class="empty" style="background:#fff;width:100%">請先在上方勾選要匯出的交易</div>';$("downloadPdfBtn").disabled=!rows.length}
function openExportPreview(){selectedExportIds.clear();renderExportSelection();renderExportPreview();setModal("exportModal",true)}
async function downloadSoldPdf(){const chosen=selectedSoldProducts();if(!chosen.length)return alert("請先勾選至少一筆交易");if(typeof window.html2pdf!=="function")return alert("PDF 元件尚未載入完成，請重新整理後再試一次。");const pages=$("exportPages"),btn=$("downloadPdfBtn");btn.disabled=true;btn.textContent="產生 PDF 中…";pages.classList.add("pdf-export");const one=chosen.length===1?(chosen[0].order_no||"交易明細"):`${chosen.length}筆`;try{await window.html2pdf().set({margin:0,filename:`拾趣萬象_交易明細_${one}_${new Date().toISOString().slice(0,10)}.pdf`,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"]}}).from(pages).save()}catch(e){alert("PDF 下載失敗："+(e?.message||e))}finally{pages.classList.remove("pdf-export");btn.disabled=false;btn.textContent="下載所選 PDF"}}
window.reviewProduct=async(id,status)=>{let note="審核通過";if(status==="returned")note=prompt("退回修改原因：","請補充更清楚的商品資訊或照片。")||"請補充商品資訊後重新送審。";if(status==="rejected")note=prompt("拒絕原因：","商品不符合平台刊登規範。")||"商品不符合平台刊登規範。";if(status==="sold"){const method=prompt("交易方式：","面交")||"",sellerBank=prompt("賣家銀行帳號（沒有可留空）：","")||"",buyerName=prompt("買家姓名：","")||"",buyerContact=prompt("買家聯絡方式：","")||"",buyerBank=prompt("買家銀行帳號（沒有可留空）：","")||"",note=prompt("後台備註（選填）：","")||"";const{error}=await supabase.rpc("admin_complete_transaction",{p_product_id:id,p_transaction_method:method,p_seller_bank_account:sellerBank,p_buyer_name:buyerName,p_buyer_contact:buyerContact,p_buyer_bank_account:buyerBank,p_review_note:note});if(error)return alert("操作失敗："+error.message);await loadAll();return}const{error}=await supabase.rpc("admin_review_listing",{p_product_id:id,p_status:status,p_review_note:note});if(error)return alert("操作失敗："+error.message);await loadAll()}
async function loadInquiries(){const{data,error}=await supabase.rpc("admin_list_inquiries",{p_status:"all"});if(error){$("list").innerHTML=`<div class="empty error">詢問讀取失敗：${esc(error.message)}</div>`;return}inquiries=data||[];$("list").innerHTML=inquiries.length?inquiries.map(i=>`<div class="item"><b>${esc(i.product_name||"一般客服詢問")}</b><div class="muted">${fmt(i.created_at)} · ${esc(i.status)}</div><div class="notice">姓名：${esc(i.buyer_name)}<br>聯絡方式：${esc(i.buyer_contact)}<br>內容：${esc(i.message)}</div>${i.admin_note?`<div class="notice">後台備註：${esc(i.admin_note)}</div>`:""}<div class="actions"><button class="btn ghost" onclick="updateInquiry('${i.id}','processing')">處理中</button><button class="btn primary" onclick="updateInquiry('${i.id}','resolved')">已完成</button></div></div>`).join(""):'<div class="empty">目前沒有詢問。</div>'}
window.updateInquiry=async(id,status)=>{const note=prompt("後台備註：","")||"";const{error}=await supabase.rpc("admin_update_inquiry",{p_inquiry_id:id,p_status:status,p_admin_note:note});if(error)return alert("更新失敗："+error.message);await loadInquiries()}
$("loginBtn").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;$("loginMsg").textContent="登入中…";const{error}=await supabase.auth.signInWithPassword({email,password});if(error){$("loginMsg").textContent="登入失敗："+error.message;return}if(!await checkAdmin()){await supabase.auth.signOut();$("loginMsg").textContent="此帳號沒有管理員權限";return}await showAdmin()};$("logoutBtn").onclick=async()=>{await supabase.auth.signOut();location.reload()};$("refreshBtn").onclick=loadAll;
$("exportPreviewBtn").onclick=openExportPreview;$("downloadPdfBtn").onclick=downloadSoldPdf;$("showFullName").onchange=renderExportPreview;$("selectAllExportBtn").onclick=()=>{soldProducts().forEach(p=>selectedExportIds.add(p.id));renderExportSelection();renderExportPreview()};$("clearExportBtn").onclick=()=>{selectedExportIds.clear();renderExportSelection();renderExportPreview()};$("saveEditBtn").onclick=saveTransactionEdit;["closeEditModalBtn","cancelEditBtn"].forEach(id=>$(id).onclick=()=>setModal("editModal",false));["closeExportModalBtn","cancelExportBtn"].forEach(id=>$(id).onclick=()=>setModal("exportModal",false));["editModal","exportModal"].forEach(id=>$(id).addEventListener("click",e=>{if(e.target===$(id))setModal(id,false)}));document.addEventListener("keydown",e=>{if(e.key==="Escape"){setModal("editModal",false);setModal("exportModal",false)}});document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=async()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));if(filter==="inquiries")await loadInquiries();else renderProducts()});if(await checkAdmin())await showAdmin();
</script></body></html>
