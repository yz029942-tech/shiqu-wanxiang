adius:14px;background:#fff;padding:12px;margin-bottom:14px}.select-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.select-list{display:grid;gap:8px;max-height:230px;overflow:auto}.select-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid #eee9e0;border-radius:12px;background:#fff}.select-item input{margin-top:3px;transform:scale(1.15)}.select-item b{display:block}.preview-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#eee9e0;padding:18px}.a4-pages{display:flex;flex-direction:column;align-items:center;gap:18px}.a4-sheet{width:min(210mm,100%);min-height:297mm;background:#fff;padding:16mm 15mm;border:1px solid #d9d3ca;box-shadow:0 10px 28px rgba(0,0,0,.08);page-break-after:always;break-after:page}.a4-sheet:last-child{page-break-after:auto;break-after:auto}.a4-title{font-size:24px;font-weight:900;text-align:center;margin-bottom:18px}.detail-value.transaction-time{display:flex;align-items:center;justify-content:space-between;gap:16px}.detail-logo{width:58px;height:58px;flex:0 0 58px;display:block}.a4-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}.detail-table{border:1px solid var(--line);border-radius:12px;overflow:hidden}.detail-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line);min-height:48px}.detail-row:last-child{border-bottom:0}.detail-label{background:#f3efe8;padding:13px 14px;font-weight:800}.detail-value{padding:13px 14px;word-break:break-word;white-space:pre-wrap}.pdf-export{gap:0!important;background:#fff!important}.pdf-export .a4-sheet{box-shadow:none!important;border:0!important;min-height:0!important;height:auto!important;page-break-after:always!important;break-after:page!important}.pdf-export .a4-sheet:last-child{page-break-after:auto!important;break-after:auto!important}.modal-note{font-size:12px;color:var(--muted);line-height:1.65;margin-top:8px}

<body><div class="wrap">
<section id="loginView" class="card login"><div class="brand">拾趣萬象</div><div class="muted">管理員後台</div><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" placeholder="請輸入管理員 Email"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼"></div><button class="btn primary" id="loginBtn">登入後台</button><p id="loginMsg" class="muted"></p></section>
<section id="adminView" class="hidden"><div class="top"><div><div class="brand">拾趣萬象｜管理員後台</div><div class="muted">商品審核、詢問與交易完成紀錄</div></div><div><a href="./index.html"><button class="btn ghost">回前台</button></a> <button class="btn ghost" id="refreshBtn">重新整理</button> <button class="btn ghost" id="logoutBtn">登出</button></div></div><div class="summary"><div class="card"><span class="muted">待審核</span><b id="countPending">0</b></div><div class="card"><span class="muted">已上架</span><b id="countApproved">0</b></div><div class="card"><span class="muted">交易完成</span><b id="countSold">0</b></div><div class="card"><span class="muted">全部商品</span><b id="countAll">0</b></div></div><div class="tabs"><button class="tab active" data-filter="pending">待審核</button><button class="tab" data-filter="approved">已上架</button><button class="tab" data-filter="sold">交易完成</button><button class="tab" data-filter="all">全部商品</button><button class="tab" data-filter="inquiries">詢問管理</button><button class="tab" id="exportPreviewBtn">預覽 / 匯出交易明細</button></div><div id="list" class="list"></div></section>
</div>
<div id="listingEditModal" class="modal-overlay hidden" aria-hidden="true"><div class="modal-card wide"><div class="modal-head"><div><h3>修改待審核商品</h3><div class="muted" id="listingEditLabel">儲存後仍維持待審核，不會直接上架。</div></div><button class="btn ghost" id="closeListingEditBtn">關閉</button></div><div class="modal-grid"><div class="field"><label>商品名稱</label><input id="leName" maxlength="100"></div><div class="field"><label>售價 NT$</label><input id="lePrice" type="number" min="1"></div><div class="field"><label>分類</label><select id="leCategory"></select></div><div class="field"><label>商品狀況</label><select id="leCondition"><option>近全新</option><option>九成新</option><option>八成新</option><option>正常使用痕跡</option></select></div><div class="field"><label>賣家姓名</label><input id="leSellerName" maxlength="50"></div><div class="field"><label>聯絡方式</label><input id="leContact" maxlength="120"></div><div class="field"><label>尺寸</label><input id="leSize" maxlength="60"></div><div class="field"><label>顏色</label><input id="leColor" maxlength="60"></div><div class="field"><label>數量</label><input id="leQuantity" type="number" min="1" step="1"></div><div class="field span2"><label>商品描述</label><textarea id="leDescription" maxlength="3000"></textarea></div><div class="field span2"><label>商品圖片（最多 5 張）</label><input id="leNewImages" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="muted">可保留原圖、刪除、調整順序，或新增圖片。新圖單張上限 6MB。</div><div id="leImages" class="listing-images" style="margin-top:10px"></div></div></div><div id="listingEditMsg" class="modal-note"></div><div class="modal-actions"><button class="btn ghost" id="cancelListingEditBtn">取消</button><button class="btn primary" id="saveListingEditBtn">儲存修改</button></div></div></div>
<div id="editModal" class="modal-overlay hidden" aria-hidden="true"><div class="modal-card"><div class="modal-head"><div><h3>編輯交易資料</h3><div class="muted" id="editProductLabel"></div></div><button class="btn ghost" id="closeEditModalBtn">關閉</button></div><div class="modal-grid"><div class="field"><label>商品名稱</label><input id="editProductName" placeholder="請輸入商品名稱"></div><div class="field"><label>交易方式</label><input id="editTransactionMethod"></div><div class="field"><label>賣家姓名</label><input id="editSellerName"></div><div class="field"><label>賣家聯絡方式</label><input id="editSellerContact"></div><div class="field"><label>賣家銀行帳號</label><input id="editSellerBank"></div><div class="field"><label>買家姓名</label><input id="editBuyerName"></div><div class="field"><label>買家聯絡方式</label><input id="editBuyerContact"></div><div class="field"><label>買家銀行帳號</label><input id="editBuyerBank"></div><div class="field"><label>交易日期</label><input id="editSoldDate" type="date"></div><div class="field"><label>交易時間</label><input id="editSoldTime" type="text" inputmode="numeric" placeholder="例如：11:30:00" autocomplete="off"></div><div class="field span2"><label>商品照片（只保留一張）</label><div class="image-edit-box"><div class="image-edit-preview" id="editImagePreview">尚無照片</div><div><input id="editImageFile" type="file" accept="image/jpeg,image/png,image/webp"><div class="muted" style="margin-top:7px">可更換商品照片；JPG、PNG、WEBP，單張上限 6MB。儲存後商品只保留這一張照片。</div></div></div></div><div class="field span2"><label>後台備註</label><textarea id="editReviewNote"></textarea></div></div><div id="editModalMsg" class="modal-note">交易時間可直接手動輸入 HH:MM 或 HH:MM:SS。</div><div class="modal-actions"><button class="btn ghost" id="cancelEditBtn">取消</button><button class="btn primary" id="saveEditBtn">儲存修改</button></div></div></div>
<div id="exportModal" class="modal-overlay hidden" aria-hidden="true"><div class="modal-card wide"><div class="modal-head"><div><h3>交易明細預覽</h3><div class="muted">先勾選要匯出的交易，再預覽與下載 PDF。</div></div><button class="btn ghost" id="closeExportModalBtn">關閉</button></div><div class="preview-tools"><label class="privacy-option"><input type="checkbox" id="showFullName" checked><span>顯示完整姓名<small>關閉後姓名會遮罩，例如：王Ｏ明</small></span></label><label class="privacy-option"><input type="checkbox" id="showFullSellerContact" checked><span>顯示完整賣家聯絡方式<small>關閉後僅保留後四碼</small></span></label><label class="privacy-option"><input type="checkbox" id="showFullBuyerContact" checked><span>顯示完整買家聯絡方式<small>關閉後僅保留後四碼</small></span></label><label class="privacy-option"><input type="checkbox" id="showFullSellerBank" checked><span>顯示完整賣家銀行帳號<small>關閉後僅保留後四碼</small></span></label><label class="privacy-option"><input type="checkbox" id="showFullBuyerBank" checked><span>顯示完整買家銀行帳號<small>關閉後僅保留後四碼</small></span></label></div><div class="select-panel"><div class="select-head"><b>選擇要匯出的交易</b><div><button class="btn ghost" id="selectAllExportBtn">全選</button> <button class="btn ghost" id="clearExportBtn">取消全選</button></div></div><div id="exportSelectList" class="select-list"></div></div><div id="exportCount" class="modal-note"></div><div class="preview-wrap"><div id="exportPages" class="a4-pages"></div></div><div class="modal-actions"><button class="btn ghost" id="cancelExportBtn">取消</button><button class="btn primary" id="downloadPdfBtn">下載所選 PDF</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://lpmxxebdcydlsticwlkd.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_5F9HuTm-P5Wof0b-KmOXfw_pT7rRvVF";const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);let products=[],inquiries=[],filter="pending",selectedExportIds=new Set();
const CATEGORIES=['衣服鞋子','3C','釣魚用具','露營裝備','寵物用品','嬰幼兒用品','書籍／收藏／娛樂','居家家具／生活美學','廚房／餐具','汽機車用品／配件','教材／商業用品','婚禮／派對用品','旅行／外派用品','居家照護／保健器材','遊戲點數／虛寶'];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=n=>"NT$ "+Number(n||0).toLocaleString("zh-TW");const statusText=s=>({pending:"待審核",approved:"已上架",returned:"退回修改",rejected:"已拒絕",sold:"已售出"})[s]||s;const fmt=d=>d?new Date(d).toLocaleString("zh-TW",{hour12:false}):"—";const localDateTimeParts=d=>{if(!d)return{date:"",time:""};const x=new Date(d);if(Number.isNaN(x.getTime()))return{date:"",time:""};const pad=n=>String(n).padStart(2,"0");return{date:`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`,time:`${pad(x.getHours())}:${pad(x.getMinutes())}:${pad(x.getSeconds())}`}};
function meta(desc=""){const raw=String(desc);const pick=l=>raw.match(new RegExp(`^\\s*${l}\\s*[：:]\\s*(.+)$`,'mu'))?.[1]?.trim()||"";return{size:pick("尺寸"),color:pick("顏色"),quantity:pick("數量"),desc:raw.replace(/^\s*(尺寸|顏色|數量)\s*[：:]\s*.*$/gmu,"").replace(/\n{3,}/g,"\n\n").trim()}}
async function checkAdmin(){const{data:{session}}=await supabase.auth.getSession();if(!session)return false;const{data,error}=await supabase.rpc("am_i_admin");return !error&&data===true}async function showAdmin(){$("loginView").classList.add("hidden");$("adminView").classList.remove("hidden");await loadAll()}
async function loadAll(){$("list").innerHTML='<div class="empty">讀取中…</div>';const{data,error}=await supabase.rpc("admin_list_products");if(error){$("list").innerHTML=`<div class="empty error">讀取失敗：${esc(error.message)}</div>`;return}products=data||[];$("countPending").textContent=products.filter(p=>p.status==="pending").length;$("countApproved").textContent=products.filter(p=>p.status==="approved").length;$("countSold").textContent=products.filter(p=>p.status==="sold").length;$("countAll").textContent=products.length;if(filter==="inquiries")await loadInquiries();else renderProducts()}
function productCard(p){const m=meta(p.description),image=p.image_urls?.[0],sold=p.status==="sold";return `<div class="item ${sold?'sold-card':''}"><div class="row"><div class="thumb">${image?`<img src="${esc(image)}" alt="">`:"📦"}</div><div><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} · ${esc(p.condition)} · ${money(p.price)}</div></div><span class="status ${esc(p.status)}">${statusText(p.status)}</span></div><div class="notice">姓名：${esc(p.seller_name)}<br>聯絡方式：${esc(p.contact)}${p.order_no?`<br>訂單編號：${esc(p.order_no)}`:""}<br>尺寸：${esc(m.size||"—")}　顏色：${esc(m.color||"—")}　數量：${esc(m.quantity||"—")}<br>描述：${esc(m.desc||"未填寫")}</div>${p.review_note&&p.status!=="sold"?`<div class="notice">審核說明：${esc(p.review_note)}</div>`:""}${sold?`<div class="notice"><b>交易資料</b><br>交易方式：${esc(p.transaction_method||"—")}<br>賣家姓名：${esc(p.seller_name||"—")}<br>賣家聯絡方式：${esc(p.contact||"—")}<br>賣家銀行帳號：${esc(p.seller_bank_account||"—")}<br>買家姓名：${esc(p.buyer_name||"—")}<br>買家聯絡方式：${esc(p.buyer_contact||"—")}<br>買家銀行帳號：${esc(p.buyer_bank_account||"—")}<br>交易時間：${fmt(p.sold_at)}</div><div class="actions"><button class="btn ghost" onclick="openEditTransaction('${p.id}')">編輯交易資料</button></div>`:""}${p.status==="pending"?`<div class="actions"><button class="btn primary" onclick="reviewProduct('${p.id}','approved')">通過上架</button><button class="btn warn" onclick="openPendingEdit('${p.id}')">修改</button><button class="btn danger" onclick="reviewProduct('${p.id}','rejected')">拒絕刊登</button></div>`:""}${p.status==="approved"?`<div class="actions"><button class="btn ghost" onclick="reviewProduct('${p.id}','sold')">設為已售出</button></div>`:""}</div></div></div>`}
function renderProducts(){let list=products;if(filter!=="all")list=products.filter(p=>p.status===filter);$("list").innerHTML=list.length?list.map(productCard).join(""):'<div class="empty">目前沒有資料。</div>'}
function maskName(name){const s=String(name||"").trim();if(!s)return"";if(s.length===1)return s;if(s.length===2)return s[0]+"Ｏ";return s[0]+"Ｏ".repeat(Math.max(1,s.length-2))+s[s.length-1]}function maskKeepLast4(value){const s=String(value||"").trim();if(!s)return"";if(s.length<=4)return s;return "＊".repeat(Math.min(s.length-4,8))+s.slice(-4)}
function setModal(id,open){const el=$(id);el.classList.toggle("hidden",!open);el.setAttribute("aria-hidden",open?"false":"true")}
let editingListingId=null,listingImages=[],removedListingPaths=[];
function cleanupListingObjectUrls(){listingImages.forEach(x=>{if(x.kind==='new'&&x.objectUrl)URL.revokeObjectURL(x.objectUrl)})}
function renderListingImages(){const box=$("leImages");box.innerHTML=listingImages.length?listingImages.map((x,i)=>`<div class="listing-image-card"><img src="${esc(x.url||x.objectUrl)}" alt="商品圖片"><div class="muted">第 ${i+1} 張${x.kind==='new'?'（新圖）':''}</div><div class="listing-image-actions"><button class="btn ghost" type="button" onclick="moveListingImage(${i},-1)" ${i===0?'disabled':''}>←</button><button class="btn ghost" type="button" onclick="moveListingImage(${i},1)" ${i===listingImages.length-1?'disabled':''}>→</button><button class="btn danger" type="button" onclick="removeListingImage(${i})">刪除</button></div></div>`).join(''):'<div class="notice">目前沒有圖片。上架前至少需要 1 張圖片。</div>'}
window.moveListingImage=(i,d)=>{const j=i+d;if(j<0||j>=listingImages.length)return;[listingImages[i],listingImages[j]]=[listingImages[j],listingImages[i]];renderListingImages()};
window.removeListingImage=i=>{const x=listingImages[i];if(x?.kind==='old'&&x.path)removedListingPaths.push(x.path);if(x?.kind==='new'&&x.objectUrl)URL.revokeObjectURL(x.objectUrl);listingImages.splice(i,1);renderListingImages()};
window.openPendingEdit=id=>{const p=products.find(x=>x.id===id);if(!p||p.status!=="pending")return alert("找不到這筆待審核商品");editingListingId=id;cleanupListingObjectUrls();removedListingPaths=[];const m=meta(p.description);$("listingEditLabel").textContent=`${p.order_no||p.query_code||"未編號"}｜儲存後仍維持待審核`;$("leName").value=p.name||"";$("lePrice").value=p.price||"";$("leCategory").innerHTML=CATEGORIES.map(c=>`<option value="${esc(c)}" ${c===p.category?'selected':''}>${esc(c)}</option>`).join('');$("leCondition").value=p.condition||"近全新";$("leSellerName").value=p.seller_name||"";$("leContact").value=p.contact||"";$("leSize").value=m.size||"";$("leColor").value=m.color||"";$("leQuantity").value=m.quantity||1;$("leDescription").value=m.desc||"";$("leNewImages").value="";const urls=p.image_urls||[],paths=p.image_paths||[];listingImages=urls.map((url,i)=>({kind:'old',url,path:paths[i]||''}));renderListingImages();$("listingEditMsg").textContent="";setModal("listingEditModal",true)};
$("leNewImages").onchange=()=>{const files=[...($("leNewImages").files||[])];for(const file of files){if(listingImages.length>=5){alert("商品圖片最多 5 張");break}if(file.size>6*1024*1024){alert(`${file.name} 超過 6MB，已略過`);continue}if(!["image/jpeg","image/png","image/webp"].includes(file.type)){alert(`${file.name} 格式不支援，已略過`);continue}const objectUrl=URL.createObjectURL(file);listingImages.push({kind:'new',file,objectUrl})}$("leNewImages").value="";renderListingImages()};
async function savePendingEdit(){const p=products.find(x=>x.id===editingListingId);if(!p)return;const name=$("leName").value.trim(),price=Number($("lePrice").value),sellerName=$("leSellerName").value.trim(),contact=$("leContact").value.trim(),desc=$("leDescription").value.trim();if(!name||!sellerName||!contact||!price||price<=0||!desc)return $("listingEditMsg").textContent="請完整填寫商品名稱、價格、賣家姓名、聯絡方式與商品描述。";if(!listingImages.length)return $("listingEditMsg").textContent="至少需要保留或新增 1 張商品圖片。";const btn=$("saveListingEditBtn");btn.disabled=true;btn.textContent="儲存中…";$("listingEditMsg").textContent="";const uploadedPaths=[];try{for(const x of listingImages){if(x.kind!=='new')continue;$("listingEditMsg").textContent="新圖片上傳中…";const ext=(x.file.name.split('.').pop()||'jpg').toLowerCase();const path=`${p.id}/admin-edit/${crypto.randomUUID()}.${ext}`;const{error}=await supabase.storage.from('product-images').upload(path,x.file,{contentType:x.file.type,upsert:false});if(error)throw error;uploadedPaths.push(path);const{data}=supabase.storage.from('product-images').getPublicUrl(path);x.kind='old';x.url=data.publicUrl;x.path=path;if(x.objectUrl){URL.revokeObjectURL(x.objectUrl);x.objectUrl=''}}const size=$("leSize").value.trim(),color=$("leColor").value.trim(),qty=$("leQuantity").value.trim();const description=[size?`尺寸：${size}`:'',color?`顏色：${color}`:'',qty?`數量：${qty}`:'',desc].filter(Boolean).join('\n');const urls=listingImages.map(x=>x.url),paths=listingImages.map(x=>x.path);const{error}=await supabase.rpc('admin_update_listing',{p_product_id:p.id,p_seller_name:sellerName,p_contact:contact,p_name:name,p_price:price,p_category:$("leCategory").value,p_condition:$("leCondition").value,p_description:description,p_image_urls:urls,p_image_paths:paths});if(error)throw error;if(removedListingPaths.length)await supabase.storage.from('product-images').remove([...new Set(removedListingPaths)]);setModal('listingEditModal',false);await loadAll()}catch(error){$("listingEditMsg").textContent="修改失敗："+(error?.message||error);if(uploadedPaths.length)await supabase.storage.from('product-images').remove(uploadedPaths)}finally{btn.disabled=false;btn.textContent="儲存修改"}}
let editingTransactionId=null,editImageObjectUrl="";function setEditImagePreview(url){const box=$("editImagePreview");box.innerHTML=url?`<img src="${esc(url)}" alt="商品照片">`:"尚無照片"}
window.openEditTransaction=id=>{const p=products.find(x=>x.id===id);if(!p)return alert("找不到這筆交易資料");editingTransactionId=id;const parts=localDateTimeParts(p.sold_at);$("editProductLabel").textContent=`${p.order_no||"未編號"}｜${p.name||"未命名商品"}`;$("editProductName").value=p.name||"";$("editTransactionMethod").value=p.transaction_method||"";$("editSellerName").value=p.seller_name||"";$("editSellerContact").value=p.contact||"";$("editSellerBank").value=p.seller_bank_account||"";$("editBuyerName").value=p.buyer_name||"";$("editBuyerContact").value=p.buyer_contact||"";$("editBuyerBank").value=p.buyer_bank_account||"";$("editSoldDate").value=parts.date;$("editSoldTime").value=parts.time;$("editReviewNote").value=p.review_note||"";$("editImageFile").value="";if(editImageObjectUrl){URL.revokeObjectURL(editImageObjectUrl);editImageObjectUrl=""}setEditImagePreview(p.image_urls?.[0]||"");$("editModalMsg").textContent="交易時間可直接手動輸入 HH:MM 或 HH:MM:SS。";setModal("editModal",true)};
$("editImageFile").onchange=()=>{const file=$("editImageFile").files?.[0];if(!file)return;if(file.size>6*1024*1024){$("editImageFile").value="";return alert("單張照片不可超過 6MB")}if(!["image/jpeg","image/png","image/webp"].includes(file.type)){$("editImageFile").value="";return alert("只接受 JPG、PNG、WEBP 圖片")}if(editImageObjectUrl)URL.revokeObjectURL(editImageObjectUrl);editImageObjectUrl=URL.createObjectURL(file);setEditImagePreview(editImageObjectUrl)};
async function saveTransactionEdit(){const p=products.find(x=>x.id===editingTransactionId);if(!p)return;const productName=$("editProductName").value.trim();if(!productName){$("editModalMsg").textContent="商品名稱不能留空";return}const soldDate=$("editSoldDate").value.trim();let soldTime=$("editSoldTime").value.trim().replace(/：/g,":");if(!soldDate||!soldTime){$("editModalMsg").textContent="請完整輸入交易日期與時間";return}const match=soldTime.match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);if(!match){$("editModalMsg").textContent="時間格式請輸入 HH:MM 或 HH:MM:SS，例如 14:35:00";return}const hh=Number(match[1]),mm=Number(match[2]),ss=Number(match[3]||0);if(hh>23||mm>59||ss>59){$("editModalMsg").textContent="時間數值不正確";return}soldTime=`${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;const soldAtDate=new Date(`${soldDate}T${soldTime}`);const btn=$("saveEditBtn");btn.disabled=true;btn.textContent="儲存中…";$("editModalMsg").textContent="";try{let imageUrl=p.image_urls?.[0]||"";const file=$("editImageFile").files?.[0];if(file){$("editModalMsg").textContent="照片上傳中…";const ext=(file.name.split(".").pop()||"jpg").toLowerCase();const path=`${p.id}/admin/${crypto.randomUUID()}.${ext}`;const{error:uploadError}=await supabase.storage.from("product-images").upload(path,file,{contentType:file.type,upsert:false});if(uploadError)throw uploadError;const{data}=supabase.storage.from("product-images").getPublicUrl(path);imageUrl=data.publicUrl}const{error}=await supabase.rpc("admin_update_transaction_v4",{p_product_id:p.id,p_product_name:productName,p_transaction_method:$("editTransactionMethod").value.trim(),p_seller_name:$("editSellerName").value.trim(),p_seller_contact:$("editSellerContact").value.trim(),p_seller_bank_account:$("editSellerBank").value.trim(),p_buyer_name:$("editBuyerName").value.trim(),p_buyer_contact:$("editBuyerContact").value.trim(),p_buyer_bank_account:$("editBuyerBank").value.trim(),p_sold_at:soldAtDate.toISOString(),p_review_note:$("editReviewNote").value.trim(),p_image_url:imageUrl});if(error)throw error;setModal("editModal",false);await loadAll()}catch(error){$("editModalMsg").textContent="更新失敗："+(error?.message||error)}finally{btn.disabled=false;btn.textContent="儲存修改"}}
const exportHeaders=["訂單編號","商品名稱","商品分類","商品價格","賣家姓名","賣家聯絡方式","交易方式","賣家銀行帳號","買家姓名","買家聯絡方式","買家銀行帳號","交易時間"];function soldProducts(){return products.filter(p=>p.status==="sold")}function rowFor(p){const fullName=$("showFullName")?.checked!==false,fullSellerContact=$("showFullSellerContact")?.checked!==false,fullBuyerContact=$("showFullBuyerContact")?.checked!==false,fullSellerBank=$("showFullSellerBank")?.checked!==false,fullBuyerBank=$("showFullBuyerBank")?.checked!==false;return[p.order_no||"",p.name||"",p.category||"",p.price??"",fullName?(p.seller_name||""):maskName(p.seller_name),fullSellerContact?(p.contact||""):maskKeepLast4(p.contact),p.transaction_method||"",fullSellerBank?(p.seller_bank_account||""):maskKeepLast4(p.seller_bank_account),fullName?(p.buyer_name||""):maskName(p.buyer_name),fullBuyerContact?(p.buyer_contact||""):maskKeepLast4(p.buyer_contact),fullBuyerBank?(p.buyer_bank_account||""):maskKeepLast4(p.buyer_bank_account),fmt(p.sold_at)]}function selectedSoldProducts(){return soldProducts().filter(p=>selectedExportIds.has(p.id))}
function renderExportSelection(){const sold=soldProducts();$("exportSelectList").innerHTML=sold.length?sold.map(p=>`<label class="select-item"><input type="checkbox" class="export-item-check" data-id="${p.id}" ${selectedExportIds.has(p.id)?"checked":""}><span><b>${esc(p.order_no||"未編號")}｜${esc(p.name||"未命名商品")}</b><span class="muted">${esc(p.seller_name||"—")} · ${fmt(p.sold_at)}</span></span></label>`).join(""):'<div class="empty">目前沒有交易完成資料</div>';document.querySelectorAll(".export-item-check").forEach(c=>c.onchange=()=>{c.checked?selectedExportIds.add(c.dataset.id):selectedExportIds.delete(c.dataset.id);renderExportPreview()})}
function renderExportPreview(){const chosen=selectedSoldProducts(),rows=chosen.map(rowFor);$("exportCount").textContent=`已選 ${rows.length} 筆／共 ${soldProducts().length} 筆交易完成紀錄`;$("exportPages").innerHTML=rows.length?rows.map(r=>`<section class="a4-sheet"><div class="a4-title">交易明細</div><div class="detail-table">${exportHeaders.map((h,i)=>`<div class="detail-row"><div class="detail-label">${esc(h)}</div><div class="detail-value ${h==="交易時間"?"transaction-time":""}">${esc(r[i]||"—")}${h==="交易時間"?`<svg class="detail-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="52" fill="none" stroke="#111" stroke-width="5"/><path d="M30 68l30 15 30-15v24l-30 15-30-15z" fill="#111"/></svg>`:""}</div></div>`).join("")}</div></section>`).join(""):'<div class="empty" style="background:#fff;width:100%">請先在上方勾選要匯出的交易</div>';$("downloadPdfBtn").disabled=!rows.length}function openExportPreview(){selectedExportIds.clear();renderExportSelection();renderExportPreview();setModal("exportModal",true)}
async function downloadSoldPdf(){const chosen=selectedSoldProducts();if(!chosen.length)return alert("請先勾選至少一筆交易");if(typeof window.html2pdf!=="function")return alert("PDF 元件尚未載入完成，請重新整理後再試一次。");const pages=$("exportPages"),btn=$("downloadPdfBtn");btn.disabled=true;btn.textContent="產生 PDF 中…";pages.classList.add("pdf-export");const one=chosen.length===1?(chosen[0].order_no||"交易明細"):`${chosen.length}筆`;try{await window.html2pdf().set({margin:0,filename:`拾趣萬象_交易明細_${one}_${new Date().toISOString().slice(0,10)}.pdf`,image:{type:"jpeg",quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"]}}).from(pages).save()}catch(e){alert("PDF 下載失敗："+(e?.message||e))}finally{pages.classList.remove("pdf-export");btn.disabled=false;btn.textContent="下載所選 PDF"}}
window.reviewProduct=async(id,status)=>{let note="審核通過";if(status==="rejected")note=prompt("拒絕原因：","商品不符合平台刊登規範。")||"商品不符合平台刊登規範。";if(status==="sold"){const method=prompt("交易方式：","面交")||"",sellerBank=prompt("賣家銀行帳號（沒有可留空）：","")||"",buyerName=prompt("買家姓名：","")||"",buyerContact=prompt("買家聯絡方式：","")||"",buyerBank=prompt("買家銀行帳號（沒有可留空）：","")||"",note=prompt("後台備註（選填）：","")||"";const{error}=await supabase.rpc("admin_complete_transaction",{p_product_id:id,p_transaction_method:method,p_seller_bank_account:sellerBank,p_buyer_name:buyerName,p_buyer_contact:buyerContact,p_buyer_bank_account:buyerBank,p_review_note:note});if(error)return alert("操作失敗："+error.message);await loadAll();return}const{error}=await supabase.rpc("admin_review_listing",{p_product_id:id,p_status:status,p_review_note:note});if(error)return alert("操作失敗："+error.message);await loadAll()}
async function loadInquiries(){const{data,error}=await supabase.rpc("admin_list_inquiries",{p_status:"all"});if(error){$("list").innerHTML=`<div class="empty error">詢問讀取失敗：${esc(error.message)}</div>`;return}inquiries=data||[];$("list").innerHTML=inquiries.length?inquiries.map(i=>`<div class="item"><b>${esc(i.product_name||"一般客服詢問")}</b><div class="muted">${fmt(i.created_at)} · ${esc(i.status)}</div><div class="notice">姓名：${esc(i.buyer_name)}<br>聯絡方式：${esc(i.buyer_contact)}<br>內容：${esc(i.message)}</div>${i.admin_note?`<div class="notice">後台備註：${esc(i.admin_note)}</div>`:""}<div class="actions"><button class="btn ghost" onclick="updateInquiry('${i.id}','processing')">處理中</button><button class="btn primary" onclick="updateInquiry('${i.id}','resolved')">已完成</button></div></div>`).join(""):'<div class="empty">目前沒有詢問。</div>'}window.updateInquiry=async(id,status)=>{const note=prompt("後台備註：","")||"";const{error}=await supabase.rpc("admin_update_inquiry",{p_inquiry_id:id,p_status:status,p_admin_note:note});if(error)return alert("更新失敗："+error.message);await loadInquiries()}
$("loginBtn").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;$("loginMsg").textContent="登入中…";const{error}=await supabase.auth.signInWithPassword({email,password});if(error){$("loginMsg").textContent="登入失敗："+error.message;return}if(!await checkAdmin()){await supabase.auth.signOut();$("loginMsg").textContent="此帳號沒有管理員權限";return}await showAdmin()};$("logoutBtn").onclick=async()=>{await supabase.auth.signOut();location.reload()};$("refreshBtn").onclick=loadAll;
$("saveListingEditBtn").onclick=savePendingEdit;["closeListingEditBtn","cancelListingEditBtn"].forEach(id=>$(id).onclick=()=>setModal("listingEditModal",false));$("exportPreviewBtn").onclick=openExportPreview;$("downloadPdfBtn").onclick=downloadSoldPdf;["showFullName","showFullSellerContact","showFullBuyerContact","showFullSellerBank","showFullBuyerBank"].forEach(id=>$(id).onchange=renderExportPreview);$("selectAllExportBtn").onclick=()=>{soldProducts().forEach(p=>selectedExportIds.add(p.id));renderExportSelection();renderExportPreview()};$("clearExportBtn").onclick=()=>{selectedExportIds.clear();renderExportSelection();renderExportPreview()};$("saveEditBtn").onclick=saveTransactionEdit;["closeEditModalBtn","cancelEditBtn"].forEach(id=>$(id).onclick=()=>setModal("editModal",false));["closeExportModalBtn","cancelExportBtn"].forEach(id=>$(id).onclick=()=>setModal("exportModal",false));["listingEditModal","editModal","exportModal"].forEach(id=>$(id).addEventListener("click",e=>{if(e.target===$(id))setModal(id,false)}));document.addEventListener("keydown",e=>{if(e.key==="Escape"){setModal("listingEditModal",false);setModal("editModal",false);setModal("exportModal",false)}});document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=async()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));if(filter==="inquiries")await loadInquiries();else renderProducts()});if(await checkAdmin())await showAdmin();
