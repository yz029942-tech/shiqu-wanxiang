name: Apply more categories

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'apply-more-categories-stage-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add categories only to listing and filter selects
        run: python .github/patch_add_more_categories.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add more product categories to selects"
          git push
