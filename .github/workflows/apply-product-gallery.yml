name: Apply product gallery carousel

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'apply-product-gallery-carousel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch product detail gallery only
        run: python .github/patch_product_gallery.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show product detail photos as carousel"
          git push
