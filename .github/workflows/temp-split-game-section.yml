name: Split game category section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-split-game-section.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split only game category from popular categories
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          category = '遊戲點數／虛寶'

          # 1) Remove only the game card from the existing popular category grid.
          game_pat = re.compile(r'\s*<button class="category[^>]*data-category="遊戲點數／虛寶"[^>]*>.*?</button>', re.S)
          s, removed = game_pat.subn('', s, count=1)
          if removed == 0:
              raise SystemExit('Game category card not found; stop to avoid touching unrelated layout')

          # 2) Restore the popular category grid to four columns on desktop only.
          s, changed_grid = re.subn(r'(\.category-grid2\{[^}]*grid-template-columns:)repeat\(5,1fr\)', r'\1repeat(4,1fr)', s, count=1)

          # 3) Add a simple standalone game section immediately before the products section.
          marker = '<!-- standalone-game-section -->'
          if marker not in s:
              game_section = '''\n<!-- standalone-game-section -->\n<section class="game-section-simple">\n  <div class="container">\n    <div class="section-title-row game-section-head">\n      <div><small>GAME MARKET</small><h2>遊戲專區</h2></div>\n    </div>\n    <button class="game-category-card" type="button" data-category="遊戲點數／虛寶">\n      <div class="game-category-copy"><b>遊戲點數／虛寶</b><small>點數・裝備・道具・遊戲幣</small></div>\n      <span class="game-category-arrow">→</span>\n    </button>\n  </div>\n</section>\n'''
              # Place just before the products section, without changing the products section itself.
              products_match = re.search(r'<section[^>]*class="[^"]*products-new[^"]*"[^>]*>', s)
              if not products_match:
                  raise SystemExit('Products section target not found; stop to avoid unrelated changes')
              s = s[:products_match.start()] + game_section + s[products_match.start():]

          # 4) Add isolated CSS for the new section only.
          css_marker = '/* standalone-game-section-style */'
          if css_marker not in s:
              css = '''\n<style>\n/* standalone-game-section-style */\n.game-section-simple{padding:0 0 34px}\n.game-section-head{margin-bottom:12px}\n.game-category-card{width:100%;min-height:112px;border:1px solid var(--line2);background:#fff;border-radius:6px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;text-align:left;cursor:pointer;color:var(--ink2);transition:transform .18s ease,box-shadow .18s ease}\n.game-category-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(30,40,34,.07)}\n.game-category-copy b,.game-category-copy small{display:block}\n.game-category-copy b{font-size:18px;margin-bottom:7px}\n.game-category-copy small{font-size:11px;color:#777}\n.game-category-arrow{font-size:24px;color:#5f6a63}\n@media(max-width:620px){.game-section-simple{padding-bottom:26px}.game-category-card{min-height:96px;padding:18px}.game-category-copy b{font-size:16px}}\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)

          # 5) Wire only this new card to the existing category filter behavior.
          js_marker = '<!-- standalone-game-section-behavior -->'
          if js_marker not in s:
              js = '''\n<!-- standalone-game-section-behavior -->\n<script>\ndocument.addEventListener('DOMContentLoaded',()=>{\n  const card=document.querySelector('.game-category-card');\n  if(!card) return;\n  card.addEventListener('click',()=>{\n    const value=card.dataset.category;\n    const select=document.getElementById('categoryFilter');\n    if(select){\n      select.value=value;\n      select.dispatchEvent(new Event('change',{bubbles:true}));\n    }\n    const products=document.getElementById('products');\n    if(products) products.scrollIntoView({behavior:'smooth',block:'start'});\n  });\n});\n</script>\n'''
              s = s.replace('</body>', js + '</body>', 1)

          p.write_text(s)
          PY

          rm .github/workflows/temp-split-game-section.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/temp-split-game-section.yml
          git commit -m "Split game category into standalone section"
          git push