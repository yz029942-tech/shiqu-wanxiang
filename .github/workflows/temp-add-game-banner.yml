name: Add game banner
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-add-game-banner.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game section only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''    <button class="game-category-card" type="button" data-category="遊戲點數／虛寶">\n      <div class="game-category-copy"><b>遊戲點數／虛寶</b><small>點數・裝備・道具・遊戲幣</small></div>\n      <span class="game-category-arrow">→</span>\n    </button>'''
          new='''    <button class="game-category-card" type="button" data-category="遊戲點數／虛寶">\n      <img class="game-market-banner" src="game-market-banner.png" alt="遊戲專區">\n    </button>'''
          if old not in s:
              raise SystemExit('target game card not found')
          s=s.replace(old,new,1)
          css='''.game-category-card{padding:0;overflow:hidden;background:transparent;border:0;min-height:0}\n.game-market-banner{display:block;width:100%;height:auto;object-fit:contain;border-radius:6px}\n'''
          s=s.replace('/* standalone-game-section-style */','/* standalone-game-section-style */\n'+css,1)
          p.write_text(s)
          PY
          rm .github/workflows/temp-add-game-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/temp-add-game-banner.yml
          git commit -m "Use uploaded image for game section"
          git push