name: Apply Product Detail Polish V1
on:
  push:
    branches: [main]
    paths:
      - 'product-detail-polish-v1.css'
      - '.github/workflows/apply-product-detail-polish-v1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add stylesheet link safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<link rel="stylesheet" href="./product-detail-polish-v1.css">'
          if marker not in s:
              if '</head>' not in s:
                  raise SystemExit('Missing </head>')
              s=s.replace('</head>', marker+'\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index change if needed
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply product detail polish stylesheet'
          git push origin main
