name: Fix game category filter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-category-filter.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add game category only to category filter
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          marker = '<!-- game-category-filter-fix -->'
          if marker not in s:
              script = '''\n<!-- game-category-filter-fix -->\n<script>\ndocument.addEventListener('DOMContentLoaded',()=>{\n  const select=document.getElementById('categoryFilter');\n  if(!select) return;\n  const value='遊戲點數／虛寶';\n  if(!Array.from(select.options).some(opt=>opt.value===value)){\n    select.add(new Option(value,value));\n  }\n});\n</script>\n'''
              if '</body>' not in s:
                  raise SystemExit('Could not find </body>')
              s = s.replace('</body>', script + '</body>', 1)
              p.write_text(s)
          PY

          rm .github/workflows/temp-fix-category-filter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/temp-fix-category-filter.yml
          git commit -m "Add game category to product filter dropdown"
          git push