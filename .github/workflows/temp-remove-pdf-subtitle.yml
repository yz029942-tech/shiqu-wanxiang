name: Remove duplicate PDF order subtitle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-remove-pdf-subtitle.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate subtitle and cleanup workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text()
          old = '<div class="a4-sub">${esc(chosen[index].order_no||`第 ${index+1} 筆交易`)}</div>'
          if old not in s:
              raise SystemExit('Target subtitle not found')
          p.write_text(s.replace(old, '', 1))
          PY
          rm .github/workflows/temp-remove-pdf-subtitle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/temp-remove-pdf-subtitle.yml
          git commit -m "Remove duplicate order number subtitle from PDF preview"
          git push