name: Apply game banner safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-game-banner-fix-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only standalone game card content
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old = '''    <button class="game-category-card" type="button" data-category="遊戲點數／虛寶">
      <div class="game-category-copy"><b>遊戲點數／虛寶</b><small>點數・裝備・道具・遊戲幣</small></div>
      <span class="game-category-arrow">→</span>
    </button>'''
          new = '''    <button class="game-category-card" type="button" data-category="遊戲點數／虛寶">
      <img class="game-market-banner" src="game-market-banner.png" alt="遊戲專區">
    </button>'''
          if old not in s:
              raise SystemExit('Game card target not found; aborting')
          s = s.replace(old, new, 1)

          old_css = '.game-category-card{width:100%;min-height:112px;border:1px solid var(--line2);background:#fff;border-radius:6px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;text-align:left;cursor:pointer;color:var(--ink2);transition:transform .18s ease,box-shadow .18s ease}'
          new_css = '.game-category-card{width:100%;min-height:0;border:0;background:transparent;border-radius:6px;padding:0;display:block;overflow:hidden;text-align:left;cursor:pointer;color:var(--ink2);transition:transform .18s ease,box-shadow .18s ease}'
          if old_css not in s:
              raise SystemExit('Game card CSS target not found; aborting')
          s = s.replace(old_css, new_css, 1)

          css_anchor = '.game-category-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(30,40,34,.07)}'
          banner_css = '\n.game-market-banner{display:block;width:100%;height:auto;object-fit:contain;border-radius:6px}'
          if '.game-market-banner{' not in s:
              if css_anchor not in s:
                  raise SystemExit('Game card hover CSS target not found; aborting')
              s = s.replace(css_anchor, css_anchor + banner_css, 1)

          old_mobile = '@media(max-width:620px){.game-section-simple{padding-bottom:26px}.game-category-card{min-height:96px;padding:18px}.game-category-copy b{font-size:16px}}'
          new_mobile = '@media(max-width:620px){.game-section-simple{padding-bottom:26px}}'
          if old_mobile in s:
              s = s.replace(old_mobile, new_mobile, 1)

          p.write_text(s)
          PY

          rm .github/workflows/temp-game-banner-fix-v2.yml
          rm -f .github/workflows/temp-add-game-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/temp-game-banner-fix-v2.yml .github/workflows/temp-add-game-banner.yml
          git commit -m "Use uploaded banner in game section"
          git push