name: Apply Hero Visual V2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip hero-v2]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add stylesheet link safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="./hero-visual-v2.css?v=1">'
          if link in s:
              print('Hero v2 stylesheet already linked; no change.')
              raise SystemExit(0)
          marker='</head>'
          if marker not in s:
              raise SystemExit('index.html missing </head>; aborting without changes')
          s=s.replace(marker,link+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only when changed
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply Hero visual polish v2 [skip hero-v2]"
          git push
