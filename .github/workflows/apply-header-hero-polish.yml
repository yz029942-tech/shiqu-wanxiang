name: Apply Header Hero Polish

on:
  push:
    paths:
      - '.github/workflows/apply-header-hero-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply scoped Header and Hero CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'header-hero-polish-v1'
          if marker in s:
              print('Polish already present; no change needed.')
              raise SystemExit(0)
          css = r'''\n<style id="header-hero-polish-v1">\n:root{--hh-green:#244b3e;--hh-paper:#f8f6f1;--hh-ink:#20231f;--hh-muted:#737770;--hh-line:#e8e2d8;--hh-shadow:0 18px 55px rgba(36,47,41,.08)}\n.top-marquee{height:30px;background:#203f35;color:#dce8e2}.marquee-inner{font-size:10.5px;letter-spacing:.075em}.new-header{background:rgba(248,246,241,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(224,217,207,.85)}.header-main{min-height:72px;height:72px;grid-template-columns:230px minmax(300px,1fr) auto;gap:24px}.brand-mark{width:38px;height:38px;border-color:#315448}.brand-mark:before{inset:7px}.brand-mark:after{inset:11px}.brand-mark span{color:#315448}.brand-word b{font-size:19px;letter-spacing:.16em}.brand-word small{color:#8a8e88;letter-spacing:.22em}.header-search{height:42px;border-color:#dcd6cc;padding-left:1px;box-shadow:0 5px 18px rgba(30,40,34,.03)}.header-search:focus-within{border-color:#8ca198;box-shadow:0 0 0 3px rgba(36,75,62,.07),0 7px 22px rgba(30,40,34,.04)}.header-search-btn{background:var(--hh-green);height:32px}.header-actions{gap:8px}.header-actions .text-btn{color:#555b56}.header-actions .btn.primary{background:var(--hh-green);padding:10px 16px}\n.new-hero{padding:46px 0 30px}.hero-shell{grid-template-columns:.95fr 1.05fr;gap:42px;align-items:center}.hero-copy2{padding:34px 8px 34px 0}.hero-label{font-size:10px;letter-spacing:.24em;color:#7c827d}.hero-copy2 h1{font-size:46px;line-height:1.28;letter-spacing:-.025em;margin:15px 0 17px;max-width:600px}.hero-copy2 p{color:var(--hh-muted);line-height:1.95;font-size:15px;max-width:580px}.hero-actions2{gap:9px;margin-top:22px}.hero-btn{padding:12px 19px}.hero-market-snapshot{margin-top:28px;border-color:var(--hh-line)}.hero-market-snapshot>span{padding:0 13px}.hero-market-snapshot>span+span{border-color:var(--hh-line)}.hero-market-snapshot small{color:#8a8e88}.trust-inline{margin-top:17px;gap:16px;color:#747974}.hero-photo-wrap{height:430px;border-radius:18px;box-shadow:var(--hh-shadow)}.hero-slide>img{object-position:center 46%}.hero-photo-card{left:22px;bottom:22px;width:270px;padding:16px 18px;border-radius:12px;box-shadow:0 10px 32px rgba(0,0,0,.08)}.hero-photo-card small{letter-spacing:.16em}.hero-photo-card b{font-size:17px}.hero-carousel-dots{right:16px;bottom:16px}\n@media(max-width:980px){.header-main{min-height:68px;height:auto;grid-template-columns:1fr auto;gap:8px 14px}.hero-shell{grid-template-columns:1fr;gap:26px}.hero-copy2{padding:25px 0 6px}.hero-copy2 h1{font-size:38px}.hero-photo-wrap{height:390px}}\n@media(max-width:620px){.top-marquee{height:28px}.header-main{min-height:60px;height:auto}.brand-mark{width:34px;height:34px}.brand-word b{font-size:17px}.new-hero{padding:28px 0 22px}.hero-copy2{padding:14px 0 0}.hero-copy2 h1{font-size:30px;line-height:1.38;margin:12px 0 14px}.hero-copy2 p{font-size:13.5px}.hero-photo-wrap{height:300px;border-radius:14px}.hero-photo-card{left:12px;bottom:12px;width:235px;padding:13px 14px;border-radius:10px}.hero-market-snapshot{margin-top:20px}}\n</style>\n'''
          if '</head>' not in s:
              raise SystemExit('Could not find </head> in index.html')
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          print('Scoped Header/Hero polish inserted.')
          PY
      - name: Commit polished index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish header and hero only [skip ci]'
          git push origin HEAD:main
