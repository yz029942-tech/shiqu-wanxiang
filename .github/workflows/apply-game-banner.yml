name: Apply game banner

"on":
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game section
        run: python .github/patch_game_banner.py
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use uploaded game banner in standalone section"
          git push