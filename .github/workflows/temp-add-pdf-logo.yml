name: Add PDF logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-add-pdf-logo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add logo to transaction preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          old_css='.a4-title{font-size:24px;font-weight:900;text-align:center;margin-bottom:4px}'
          new_css='.a4-title{font-size:24px;font-weight:900;text-align:center;margin-bottom:18px}.detail-value.transaction-time{display:flex;align-items:center;justify-content:space-between;gap:16px}.detail-logo{width:58px;height:58px;flex:0 0 58px;display:block}'
          if old_css in s:
              s=s.replace(old_css,new_css,1)
          old_title='<div class="a4-title">拾趣萬象｜交易明細</div>'
          if old_title in s:
              s=s.replace(old_title,'<div class="a4-title">交易明細</div>',1)
          old_row='${exportHeaders.map((h,i)=>`<div class="detail-row"><div class="detail-label">${esc(h)}</div><div class="detail-value">${esc(r[i]||"—")}</div></div>`).join("")}'
          new_row='${exportHeaders.map((h,i)=>`<div class="detail-row"><div class="detail-label">${esc(h)}</div><div class="detail-value ${h==="交易時間"?"transaction-time":""}">${esc(r[i]||"—")}${h==="交易時間"?`<svg class="detail-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="52" fill="none" stroke="#111" stroke-width="5"/><path d="M30 68l30 15 30-15v24l-30 15-30-15z" fill="#111"/><path d="M30 64l25-13 5 25-30-12zm60 0L65 51l-5 25 30-12z" fill="#111"/><path d="M42 29l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#111"/><circle cx="77" cy="35" r="8" fill="#111"/><ellipse cx="77" cy="35" rx="16" ry="6" fill="none" stroke="#111" stroke-width="4" transform="rotate(-12 77 35)"/><circle cx="28" cy="47" r="4" fill="#111"/><circle cx="95" cy="49" r="4" fill="#111"/></svg>`:""}</div></div>`).join("")}'
          if old_row not in s:
              raise SystemExit('target row template not found')
          s=s.replace(old_row,new_row,1)
          p.write_text(s)
          PY
          rm .github/workflows/temp-add-pdf-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/temp-add-pdf-logo.yml
          git commit -m "Add logo to transaction PDF preview"
          git push
