name: deploy-midautumn-q15
on:
  push:
    branches: [chatgpt-midautumn-q15-final]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and validate hero
        shell: bash
        run: |
          set -euo pipefail
          cat midautumn_b64/p00.txt midautumn_b64/p01.txt midautumn_b64/p02.txt midautumn_b64/p03.txt midautumn_b64/p04.txt midautumn_b64/p05.txt midautumn_b64/p06.txt | base64 -d > /tmp/hero-midautumn-2026.webp
          echo "964b865e1d899d0a0c2d4af9b88990bcc59e3675c2c7445960d1065344a22c0c  /tmp/hero-midautumn-2026.webp" | sha256sum -c -
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('/tmp/hero-midautumn-2026.webp')
          im=Image.open(p)
          print('FORMAT',im.format,'SIZE',im.size,'BYTES',p.stat().st_size)
          if im.format!='WEBP': raise SystemExit('not WEBP')
          if im.size!=(1500,1000): raise SystemExit(f'unexpected size {im.size}')
          if p.stat().st_size != 63926: raise SystemExit(f'unexpected bytes {p.stat().st_size}')
          PY
      - name: Apply exact production change
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/prod origin/main
          cp /tmp/hero-midautumn-2026.webp /tmp/prod/hero-midautumn-2026.webp
          cd /tmp/prod
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='      <div class="hero-slide hero-placeholder hero-placeholder-1" data-slide="1" aria-label="預留輪播圖片"></div>'
          new='      <div class="hero-slide" data-slide="1">\n        <img src="./hero-midautumn-2026.webp?v=1" alt="拾趣萬象中秋主視覺">\n      </div>'
          if s.count(old)!=1:
              raise SystemExit(f'expected placeholder exactly once, got {s.count(old)}')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8',newline='')
          PY
          git config user.name "ChatGPT exact deploy"
          git config user.email "actions@users.noreply.github.com"
          git add index.html hero-midautumn-2026.webp
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'hero-midautumn-2026.webp\nindex.html' || test "$changed" = $'index.html\nhero-midautumn-2026.webp'
          git commit -m "Add Mid-Autumn hero carousel image"
          git push origin HEAD:main
