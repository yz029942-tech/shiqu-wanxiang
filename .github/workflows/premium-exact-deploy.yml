name: premium-exact-deploy
on:
  push:
    branches: [chatgpt-premium-exact]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact uploaded files and push main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/deploy origin/main
          cd /tmp/deploy
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib
          p=Path('index.html')
          s=p.read_text()
          reps=[
          ('<link rel="stylesheet" href="./product-detail-polish-v1.css">\n</head>','<link rel="stylesheet" href="./product-detail-polish-v1.css">\n<link rel="stylesheet" href="./premium-gold-polish-v1.css">\n</head>'),
          ('    <div class="more-category-grid">\n','    <div class="more-cat-scroll-wrap">\n    <button type="button" class="more-cat-arrow more-cat-arrow-left" aria-label="向左捲動" onclick="document.getElementById(\'moreCategoryGrid\').scrollBy({left:-320,behavior:\'smooth\'})">‹</button>\n    <div class="more-category-grid" id="moreCategoryGrid">\n'),
          ('      <button class="more-category-btn" type="button" data-category="居家照護／保健器材"><b>居家照護／保健器材</b><span>照護・輔具・保健・居家設備</span></button>\n    </div>\n  </div>\n</section>','      <button class="more-category-btn" type="button" data-category="居家照護／保健器材"><b>居家照護／保健器材</b><span>照護・輔具・保健・居家設備</span></button>\n    </div>\n    <button type="button" class="more-cat-arrow more-cat-arrow-right" aria-label="向右捲動" onclick="document.getElementById(\'moreCategoryGrid\').scrollBy({left:320,behavior:\'smooth\'})">›</button>\n    </div>\n  </div>\n</section>')
          ]
          for a,b in reps:
              if s.count(a)!=1: raise SystemExit('INDEX_ANCHOR_MISMATCH')
              s=s.replace(a,b)
          p.write_text(s)
          css=zlib.decompress(base64.b64decode(''))
          Path('premium-gold-polish-v1.css').write_bytes(css)
          targets={
          'index.html':'0abd63472d689274567ab8a226488aee9df72aaa',
          'admin.html':'dd0736ca25f86ad20969ec39b7e519704cda3917',
          'category-polish-v1.css':'f8e9c41a74d78fb7ee156830ac1e125e6a8fcb90',
          'footer-spacing-polish-v1.css':'d670a39f540f3e26f8e975ae0d2110628c58c084',
          'hero-visual-v2.css':'fc506025e22e21fab375eef1c4e8647a66217f81',
          'info-sections-polish-v1.css':'4a3b09ef76c55eb72fe8c3fa8f415358579ea6d7',
          'premium-gold-polish-v1.css':'be39c89c440f6ccf9670135b43d492b1261c18e6',
          'product-detail-polish-v1.css':'d39c5bf5a33165a7cc1243149d8057b223a0605a',
          'product-polish-v1.css':'ddf0e530e6dd3e98959d143ff2e2c2097538bc54',
          'search-polish-v1.css':'c9067ee0053a011b641ce54809cb1e67f110fc77',
          'sell-modal-polish-v1.css':'8bd98db5ae1d22eaaef900a6a81f39ac5fa638c0',
          'support-query-polish-v1.css':'263df5cf755b5e196e5bf21bd3d32db508bd5f3d',
          'vercel.json':'914add56b076534e3bc38274461a2b5d7e6c5a77'
          }
          for name,want in targets.items():
              b=Path(name).read_bytes()
              got=hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
              if got!=want: raise SystemExit(f'VERIFY_FAIL {name} {got} {want}')
              print('VERIFIED',name,got)
          PY
          git config user.name "ChatGPT exact deploy"
          git config user.email "actions@users.noreply.github.com"
          git add index.html admin.html *.css vercel.json
          git commit -m "Apply premium gold polish exact files"
          git push origin HEAD:main
