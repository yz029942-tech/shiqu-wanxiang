name: Temp test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-test.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python .github/patch_game_banner.py
      - name: Commit
        run: |
          rm .github/workflows/temp-test.yml
          rm .github/patch_game_banner.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/temp-test.yml .github/patch_game_banner.py
          git commit -m "Use uploaded game banner in standalone section"
          git push