name: Apply Search Polish V1
on:
  push:
    paths:
      - 'search-polish-v1.css'
      - '.github/workflows/apply-search-polish-v1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire isolated search polish stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="./search-polish-v1.css">'
          if link not in s:
              s=s.replace('</head>', link+'\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire isolated search polish stylesheet"
          git push
